name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Pack the published tarball
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      # Installed without hoisting, so the CLI can only resolve the
      # dependencies it declares itself. A module that happens to be pulled in
      # by vitest or by another dependency today is not available here.
      - name: Install the tarball with no hoisting
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          npm init -y
          npm install --omit=dev --install-strategy=nested /tmp/pack/*.tgz

      - name: The packed CLI runs on its declared dependencies alone
        run: |
          cd /tmp/smoke
          ./node_modules/.bin/hatebu --help

      # The tokenizer is a wasm module loaded only by `words`, and only when
      # there is a title to tokenize, so --help alone would not notice it
      # missing from the packed dependencies. A seeded cache day gives it one
      # without needing an account or the network.
      - name: The tokenizer loads under that install
        run: |
          cd /tmp/smoke
          mkdir -p /tmp/smoke/cache/hatebucli/1970/01
          printf '%s' '[{"title":"\u5730\u56f3\u306e\u8a71\u3092\u3059\u308b","link":"https://example.com/a","date":"1970-01-01T00:00:00.000Z","description":"","tags":[]}]' \
            > /tmp/smoke/cache/hatebucli/1970/01/01.json
          XDG_CACHE_HOME=/tmp/smoke/cache ./node_modules/.bin/hatebu words --date 1970-01-01 -j | tee words.json
          grep -q '"word"' words.json

      # The MCP server pulls in the largest dependency the CLI has, and it is
      # only reached through --mcp-server, so --help alone would not notice a
      # missing one.
      - name: The MCP server answers a handshake under that install
        run: |
          cd /tmp/smoke
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | HATENA_USER=ci-user timeout 30 ./node_modules/.bin/hatebu --mcp-server > handshake.jsonl
          cat handshake.jsonl
          grep -q '"name":"hatebucli"' handshake.jsonl
          grep -q '"hatebu_search"' handshake.jsonl
          grep -q '"hatebu_list"' handshake.jsonl
          grep -q '"hatebu_domains"' handshake.jsonl
          grep -q '"hatebu_tags"' handshake.jsonl
          grep -q '"hatebu_words"' handshake.jsonl
          grep -q '"hatebu_stats"' handshake.jsonl
